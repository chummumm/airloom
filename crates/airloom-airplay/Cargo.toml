[package]
name = "airloom-airplay"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Independent AirPlay 2 audio sender for Airloom"

[dependencies]
chacha20poly1305 = "=0.10.1"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
hex = "=0.4.3"
hkdf = "=0.12.4"
md-5 = "=0.10.6"
mdns-sd = "=0.11.5"
num-bigint = "=0.4.6"
plist = "=1.9.0"
rand = "=0.8.6"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
srp = "=0.6.0"
subtle = "=2.6.1"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = "=1.8.2"

[dev-dependencies]
serde_json = "=1.0.145"
