name: Build and verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Protocol and audio tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  windows:
    name: Native Windows application
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          targets: x86_64-pc-windows-msvc
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Build native app
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration Release
      - name: Package installer
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Launch native UI and capture evidence
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - name: Windows Rust tests
        run: cargo test --workspace --locked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airloom-windows-x64
          path: |
            dist/*
            artifacts/*
          if-no-files-found: warn
          retention-days: 14

