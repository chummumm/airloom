name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build and verify run ID to publish
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify build and publish Latest release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Expected a numeric build run ID.'; exit 1; }
          gh api "repos/$REPOSITORY/actions/runs/$BUILD_RUN_ID" > /tmp/airloom-release-run.json
          BUILD_SHA=$(python3 - <<'PY'
          import json, os
          with open('/tmp/airloom-release-run.json') as source:
              run = json.load(source)
          assert run['conclusion'] == 'success', 'Only successful builds may be released.'
          assert run['head_branch'] == 'main', 'Expected a main branch build.'
          assert run['event'] in ('push', 'workflow_dispatch'), 'PR artifacts cannot be released.'
          assert run['path'] == '.github/workflows/ci.yml', 'Unexpected build workflow.'
          assert run['head_repository']['full_name'] == os.environ['REPOSITORY'], 'Unexpected source repository.'
          print(run['head_sha'])
          PY
          )
          gh api "repos/$REPOSITORY/contents/Cargo.toml?ref=$BUILD_SHA" --jq .content | base64 --decode > /tmp/airloom-release-cargo.toml
          APP_VERSION=$(python3 - <<'PY'
          import tomllib
          with open('/tmp/airloom-release-cargo.toml', 'rb') as source:
              print(tomllib.load(source)['workspace']['package']['version'])
          PY
          )
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable numeric version.'; exit 1; }
          gh api "repos/$REPOSITORY/contents/docs/releases/$APP_VERSION.md?ref=$BUILD_SHA" --jq .content | base64 --decode > /tmp/airloom-release-notes.md
          test -s /tmp/airloom-release-notes.md
          INSTALLER="Airloom-$APP_VERSION-setup-x64.exe"
          gh run download "$BUILD_RUN_ID" --repo "$REPOSITORY" --name airloom-windows-x64 --dir release-assets
          test -s "release-assets/dist/$INSTALLER"
          test -s release-assets/dist/airloom-windows-x64-portable.zip
          test -s release-assets/artifacts/native-smoke.json
          python3 - <<'PY'
          import json
          with open('release-assets/artifacts/native-smoke.json', encoding='utf-8-sig') as source:
              assert json.load(source)['result'] == 'window-opened', 'Native startup check is missing.'
          PY
          (cd release-assets/dist && sha256sum "$INSTALLER" airloom-windows-x64-portable.zip > SHA256SUMS.txt)
          gh release create "v$APP_VERSION" \
            --repo "$REPOSITORY" --target "$BUILD_SHA" --latest \
            --title "Airloom $APP_VERSION" \
            --notes-file /tmp/airloom-release-notes.md \
            "release-assets/dist/$INSTALLER" \
            release-assets/dist/airloom-windows-x64-portable.zip \
            release-assets/dist/SHA256SUMS.txt \
            release-assets/artifacts/native-window.png \
            release-assets/artifacts/settings-window.png \
            release-assets/artifacts/native-smoke.json
